<!DOCTYPE html>
<html>

<head>
    <title>NetWork - Perfil</title>
    <link href="./css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="./js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <header></header>

    <section class="learn-hero-profile">
        <div class="container learn-content text-center">
            <h1 class="display-4 fw-bold">Mi Perfil</h1>
        </div>
    </section>

    <div class="layout-container">
        <aside class="sidebar info-section">
            <i class="bi bi-gear settings-icon" role="button" data-bs-toggle="modal"
                data-bs-target="#settingsModal"></i>
            <section>
                <h1 class="text-center">Información Personal</h1>
            </section>

            <hr class="my-3">

            <section class="mt-5">
                <div class="pb-3">
                    <label class="form-label fw-bold">Nombre Completo</label>
                    <p id="nombreUsuario">—</p>
                </div>
                <div class="pb-3">
                    <label class="form-label fw-bold">Correo electrónico</label>
                    <p id="correoUsuario">—</p>
                </div>
                <div class="pb-3">
                    <label class="form-label fw-bold">Edad</label>
                    <p id="edadUsuario">—</p>
                </div>
                <div class="pb-3">
                    <label class="form-label fw-bold">Ubicación</label>
                    <p id="ubicacionUsuario">—</p>
                </div>
            </section>
        </aside>

        <main>
            <section>
                <div class="mb-4">
                    <label for="fotoPerfil" class="form-label fw-bold">Foto de perfil</label>
                    <input class="form-control" type="file" id="fotoPerfil" accept="image/*">
                    <div class="mt-3">
                        <img id="previewFoto" src="#" alt="Vista previa" style="max-width: 150px; display: none;"
                            class="img-thumbnail">
                    </div>
                </div>
                <div class="mb-4">
                    <label for="documentoUsuario" class="form-label fw-bold">Currículum (Documento PDF)</label>
                    <input class="form-control" type="file" id="documentoUsuario" accept=".pdf,.doc,.docx">
                </div>
            </section>
        </main>
    </div>

    <!-- Modal Configuración -->
    <div class="modal fade learn-modal" id="settingsModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar">
                        <i class="bi bi-x"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-lg-12 info-section">
                            <h3 class="mb-4">Configuración</h3>
                            <i class="bi bi-box-arrow-left logout-icon" role="button"></i>
                            <div>
                                <hr>
                                <h5 class="mb-4">Notificaciones</h5>
                                <p class="mb-3">Publicaciones de los que sigues</p>
                                <p class="mb-3">Ofertas de trabajo que te pueden interesar</p>
                                <p class="mb-3">Solicitudes de freelance</p>
                                <p class="mb-3">Has iniciado sesión en tu cuenta</p>
                            </div>

                            <div class="form-check form-switch switch1">
                                <input class="form-check-input" type="checkbox" id="activarPublicaciones">
                                <label class="form-check-label" for="activarPublicaciones"></label>
                            </div>
                            <div class="form-check form-switch switch2">
                                <input class="form-check-input" type="checkbox" id="activarPublicaciones">
                                <label class="form-check-label" for="activarPublicaciones"></label>
                            </div>
                            <div class="form-check form-switch switch3">
                                <input class="form-check-input" type="checkbox" id="activarPublicaciones">
                                <label class="form-check-label" for="activarPublicaciones"></label>
                            </div>
                            <div class="form-check form-switch switch4">
                                <input class="form-check-input" type="checkbox" id="activarPublicaciones">
                                <label class="form-check-label" for="activarPublicaciones"></label>
                            </div>

                            <div>
                                <hr>
                                <h5 class="mb-4">Seguridad</h5>
                                <p class="mb-3">Reportar contenido</p>
                                <p class="mb-3">Filtros automáticos</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer text-center mt-3"></footer>

    <!-- Load components -->
    <script src="./js/components/header.js"></script>
    <script src="./js/components/footer.js"></script>
    <script src="./js/index.js"></script>
</body>

</html>
